# Temporary (MS-163): runs the check's UI flow on an iPhone simulator and pushes its screenshot to the scratch branch
# ms-163-shot-output for the PR. Removed before the PR is final.
name: MS-163 screenshot (temporary)

on:
  push:
    branches: [claude/project-thread-ek76oo]

permissions:
  contents: write

jobs:
  shot:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the project
        run: make project

      - name: Boot an iPhone 16 with a 9:41 status bar
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -F "    iPhone 16 (" | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3

      - name: Run the check's UI flow
        run: |
          set -o pipefail
          xcodebuild -project Dentory.xcodeproj -scheme Dentory -clonedSourcePackagesDirPath .build/spm \
            -onlyUsePackageVersionsFromResolvedFile -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -resultBundlePath shot.xcresult \
            -only-testing:DentoryUITests/ReceiveCheckUITests test 2>&1 | tail -150 || echo "UI FLOW FAILED"

      - name: Export the screenshot and the results
        run: |
          mkdir -p out
          xcrun xcresulttool export attachments --path shot.xcresult --output-path out || true
          xcrun xcresulttool get test-results summary --path shot.xcresult > out/summary.json || true
          ls -la out

      - name: Push them to ms-163-shot-output
        run: |
          cd out
          git init -b ms-163-shot-output
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "MS-163 screenshot output"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            ms-163-shot-output
