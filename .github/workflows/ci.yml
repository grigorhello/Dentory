name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate, lint, build and test
        run: make project lint build test WARNINGS_AS_ERRORS=YES SPM_FLAGS=-onlyUsePackageVersionsFromResolvedFile

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A fixed version downloads the release directly; "latest" asks the GitHub API first and fails when the
      # runner's API rate limit is used up. Raise it on purpose, with the local CLI.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Linux hands out ephemeral ports from 32768 up, so an outgoing connection can grab 54322
      # before Postgres binds it ("address already in use"). Reserving the Supabase ports stops that.
      - name: Keep the Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start Postgres, apply migrations and seed, run the pgTAP tests
        run: |
          supabase db start
          make db-reset db-test

      # The demo seed checks its own numbers against the frames and fails when they drift. The tests then run
      # again on the seeded database, the state developers test against locally.
      - name: Load the demo clinic and rerun the pgTAP tests on it
        run: make seed-demo db-test

      - name: Type-check the Edge Functions
        run: make functions-check
