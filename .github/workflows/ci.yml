name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate, lint, build and test
        run: make project lint build test WARNINGS_AS_ERRORS=YES SPM_FLAGS=-onlyUsePackageVersionsFromResolvedFile

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start Postgres, apply migrations and seed, run the pgTAP tests
        run: |
          supabase db start
          make db-reset db-test

      - name: Type-check the Edge Functions
        run: make functions-check
