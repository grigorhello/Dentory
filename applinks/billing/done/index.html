<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dentory billing</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; background: #f7f5f2; color: #201515; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 480px; margin: 48px auto; padding: 32px; background: #fff; border-radius: 12px; }
    .eyebrow { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #7a6f6f; }
    h1 { font-size: 28px; margin: 8px 0 16px; }
    p { font-size: 16px; line-height: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Billing</div>
    <h1 id="title">Payment method saved</h1>
    <p id="detail">Tap Done to go back to Dentory. Billing shows the card in a few seconds.</p>
  </main>
  <script>
    (function () {
      // Stripe Checkout and the Customer Portal send the admin here (MS-140): ?checkout=done|canceled or ?portal=done.
      var query = new URLSearchParams(location.search);
      if (query.get("checkout") === "canceled") {
        document.getElementById("title").textContent = "Nothing was changed";
        document.getElementById("detail").textContent = "Tap Done to go back to Dentory.";
      } else if (query.get("portal") === "done") {
        document.getElementById("title").textContent = "Billing updated";
        document.getElementById("detail").textContent = "Tap Done to go back to Dentory. Changes show in a few seconds.";
      }
    })();
  </script>
</body>
</html>
