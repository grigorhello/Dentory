<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Dentory</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; background: #f7f5f2; color: #201515; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 480px; margin: 48px auto; padding: 32px; background: #fff; border-radius: 12px; }
    .eyebrow { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #7a6f6f; }
    h1 { font-size: 28px; margin: 8px 0 16px; }
    p { font-size: 16px; line-height: 24px; }
    .button { display: inline-block; background: #1a63d6; color: #fff; text-decoration: none; font-weight: 600; padding: 14px 24px; border-radius: 8px; }
    .muted { color: #7a6f6f; font-size: 14px; line-height: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Weekly digest</div>
    <h1>Open Dentory</h1>
    <p>What needs attention this week is on Home in the Dentory app on your iPhone or iPad.</p>
    <p><a class="button" href="dentory://open">Open in Dentory</a></p>
    <p class="muted">No Dentory on this device? Install it from the App Store and sign in with the address this email came to.</p>
  </main>
</body>
</html>
