name: Dentory
options:
  bundleIdPrefix: ca.dentory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Keep Xcode from generating `Color.primary`-style accessors for asset colors, which would clash with SwiftUI's own.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    # `make ... WARNINGS_AS_ERRORS=YES` (CI) turns warnings into errors for our targets only;
    # setting SWIFT_TREAT_WARNINGS_AS_ERRORS globally would also hit SPM packages.
    WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(WARNINGS_AS_ERRORS)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(WARNINGS_AS_ERRORS)

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0

targets:
  Dentory:
    type: application
    platform: iOS
    sources:
      - path: Dentory
        excludes:
          - "**/README.md"
    dependencies:
      - package: Supabase
      - package: Sentry
      - package: PostHog
    # Universal links `https://app.dentory.ca/invite?token=…` (MS-100 D12, MS-112). The domain serves
    # applinks/.well-known/apple-app-site-association with the Apple team id once the team exists.
    # Push notifications through APNs (MS-144); Xcode turns `development` into `production` when it exports for
    # TestFlight and the App Store.
    entitlements:
      path: Dentory/Resources/Dentory.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:app.dentory.ca
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Dentory
        PRODUCT_BUNDLE_IDENTIFIER: ca.dentory.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_FILE: Dentory/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dentory
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # V1.1 is light only (MS-136 audit V-01): every frame is light, and the system's own controls (month wheels,
        # menus, action sheets) would draw dark on the cream page with the phone set to Dark.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Receive delivery's Take a photo scans invoices with VisionKit's document camera (MS-126).
        INFOPLIST_KEY_NSCameraUsageDescription: "Dentory uses the camera to scan invoices and packing slips."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  DentoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DentoryTests
    dependencies:
      - target: Dentory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.dentory.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dentory.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dentory

  DentoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DentoryUITests
    dependencies:
      - target: Dentory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.dentory.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Handles what iOS puts over the app uninvited, such as iOS 26's Save Password? (UITestInterruptions.swift).
        INFOPLIST_KEY_NSPrincipalClass: DentoryUITestInterruptions
        TEST_TARGET_NAME: Dentory

  # The end-to-end flows on the local stack seeded with the demo clinic (MS-136): `make e2e`, never `make uitest`.
  DentoryE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DentoryE2ETests
      # The same handlers as the UI flows (iOS 26's Save Password? after a sign-in).
      - DentoryUITests/UITestInterruptions.swift
    dependencies:
      - target: Dentory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.dentory.app.e2etests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: DentoryUITestInterruptions
        TEST_TARGET_NAME: Dentory

schemes:
  Dentory:
    build:
      targets:
        Dentory: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DentoryTests
        - DentoryUITests
        # Built with the others and skipped here: the DentoryE2E scheme runs them (`make e2e`), which needs the local
        # stack (MS-136).
        - name: DentoryE2ETests
          skipped: true
  DentoryE2E:
    build:
      targets:
        Dentory: all
    test:
      config: Debug
      targets:
        - DentoryE2ETests
