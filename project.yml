name: MediSave
options:
  bundleIdPrefix: com.medisave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Keep Xcode from generating `Color.primary`-style accessors for asset colors, which would clash with SwiftUI's own.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    # `make ... WARNINGS_AS_ERRORS=YES` (CI) turns warnings into errors for our targets only;
    # setting SWIFT_TREAT_WARNINGS_AS_ERRORS globally would also hit SPM packages.
    WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(WARNINGS_AS_ERRORS)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(WARNINGS_AS_ERRORS)

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0

targets:
  MediSave:
    type: application
    platform: iOS
    sources:
      - path: MediSave
        excludes:
          - "**/README.md"
    dependencies:
      - package: Supabase
      - package: Sentry
    settings:
      base:
        PRODUCT_NAME: MediSave
        PRODUCT_BUNDLE_IDENTIFIER: com.medisave.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_FILE: MediSave/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MediSave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  MediSaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MediSaveTests
    dependencies:
      - target: MediSave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medisave.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MediSave.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MediSave

  MediSaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MediSaveUITests
    dependencies:
      - target: MediSave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medisave.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MediSave

schemes:
  MediSave:
    build:
      targets:
        MediSave: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MediSaveTests
        - MediSaveUITests
